name: Build & Release Executable

on:
  push:
    tags:
      - 'v*' # Triggers whenever you push a tag starting with 'v' (e.g., v1.0.0)

jobs:
  build-and-release:
    runs-on: windows-latest # Required since we are compiling a Windows binary
    permissions:
      contents: write # Allows the action to upload binaries to your Releases

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install PS2EXE Compiler
        shell: powershell # Required to run Windows PowerShell 5.1 environment
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module ps2exe -Force -Scope CurrentUser

      - name: Compile PS1 to EXE
        shell: powershell
        run: |
          # Replace 'PowerCompare.ps1' with your script name, and 'pcomp.exe' with your tool name
          # Using switches to set metadata dynamically
          Invoke-ps2exe `
            -inputFile ".\PowerCompareGUI.ps1" `
            -outputFile ".\pcomp.exe" `
            -noConsole `
            -title "pcomp" `
            -description "PowerShell folder comparison utility (Based on AlexIn-Tech/PowerCompare)" `
            -company "soyuiz" `
            -copyright "2026 soyuiz" `
            -version "1.0.0"

      - name: Generate SHA-256 Checksum File
        shell: powershell
        run: |
          # Computes hash and strips formatting to output a plain string text file
          Get-FileHash .\pcomp.exe | Select-Object -ExpandProperty Hash | Out-File -FilePath .\pcomp.exe.sha256 -Encoding ascii

      - name: Create Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pcomp.exe
            pcomp.exe.sha256
          body_path: ./README.md # Uses your README as the baseline or leave blank for a clean template
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
